name: MAAM CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/737854461350/locations/global/workloadIdentityPools/maam-github/providers/github"
          service_account: "maam-github-cd@versa-dashboard.iam.gserviceaccount.com"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud authentication
        run: gcloud auth list
      
      - name: Set up Python
        uses: actions/setup-python@v6
          with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall main.py src pipelines

      - name: Validate dbt project
        working-directory: dbt/maam
        run: dbt parse

      - name: Build Docker image
        run: docker build -t maam-ci .